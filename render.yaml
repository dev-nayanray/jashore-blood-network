# Render Blueprint for the Jashore Blood Network API (NestJS).
# The service runs from the repo root because this is a pnpm workspace:
# the lockfile, workspace packages (@jbn/shared-types, @jbn/validation)
# and the pnpm filter all resolve from the workspace root, not apps/api.
# Render injects PORT automatically; the app reads it in main.ts.

services:
  - type: web
    name: jashore-blood-network-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @jbn/api build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
